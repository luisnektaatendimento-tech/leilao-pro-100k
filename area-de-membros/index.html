<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Comercial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Trilho lateral + área de trabalho. Roteiros como trilha de etapas: uma etapa por vez, falas em balões. */
:root{
  --bg:#0a0b0d; --panel:#111317; --panel-2:#171a1f; --line:#252930; --line-2:#323741;
  --text:#eef0f3; --muted:#9097a1;
  --lime:#c8f43c; --red:#ff5a4d; --amber:#ffb547; --blue:#6aa0ff; --violet:#b9a2ff; --wa:#1f6f5c;
  --ink:#11140a;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,3.6vw,36px);line-height:1.1} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.mono{font:500 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);padding:22px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.brand{padding:0 10px;display:flex;flex-direction:column;gap:8px}
.brand b{font:700 18px/1 var(--f-display)}
.brand .logos{display:flex;align-items:center;gap:10px}
.brand .logos img{height:16px} .brand .logos img.cw{height:28px;border-radius:5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a[aria-current="page"]{background:var(--panel-2);color:var(--text)}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.nav a[aria-current="page"] .dot{background:var(--lime)}
.rail .prog{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime)}

main{min-width:0;padding-block:30px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.tile:hover{border-color:var(--line-2)}
.crumb{display:flex;gap:8px;align-items:center}
.crumb a{text-decoration:none;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.c-lime{--c:var(--lime)} .c-red{--c:var(--red)} .c-violet{--c:var(--violet)} .c-amber{--c:var(--amber)} .c-blue{--c:var(--blue)} .c-muted{--c:var(--muted)}
.chip.plat{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.prio{font:700 13px/1 var(--f-display);padding:6px 9px;border-radius:8px;background:var(--amber);color:#1a1205}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);text-decoration:none;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}

/* balões de fala */
.say{display:flex;align-items:flex-start;gap:10px;max-width:640px}
.bubble{position:relative;flex:1;min-width:0;padding:12px 14px;border-radius:16px;border-top-left-radius:4px;background:var(--panel-2);border:1px solid var(--line-2);font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.say.wa .bubble{background:var(--wa);border-color:#2a8a73;border-top-left-radius:16px;border-top-right-radius:4px}
.say.wa{margin-left:auto;flex-direction:row-reverse}
.say .who{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-mono);background:var(--panel-2);border:1px solid var(--line-2);color:var(--lime)}
.cp{flex:none;align-self:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.cp svg{width:16px;height:16px}
.cp.ok{border-color:var(--lime);color:var(--lime)}
.tok{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent);border-radius:4px;padding:0 2px}
.fill{color:var(--lime)}
.say.wa .tok{color:#ffe2a8} .say.wa .fill{color:#eaffb0}

/* trilha de etapas */
.track{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 2px 8px}
.track button{flex:1 0 92px;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;cursor:pointer;color:var(--muted);position:relative;padding:0 4px}
.track button::before{content:"";position:absolute;top:19px;left:-50%;right:50%;height:2px;background:var(--line)}
.track button:first-child::before{display:none}
.track button.past::before,.track button[aria-current="step"]::before{background:var(--lime)}
.track .n{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-display);background:var(--panel);border:2px solid var(--line-2)}
.track button.past .n{border-color:var(--lime);color:var(--lime)}
.track button[aria-current="step"] .n{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.track button[aria-current="step"]{color:var(--text)}
.track .l{font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:240px}
.hint{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--lime);padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--lime) 10%,transparent);align-self:flex-start}
.hint.warn{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.spin4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.sp{border-radius:14px;border:1px solid var(--line-2);border-top:3px solid var(--s);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2);min-width:0}
.sp .L{font:700 26px/1 var(--f-display);color:var(--s)}
.sp .q{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.sp .q span{flex:1;min-width:0}
.sp .cp{width:28px;height:28px}
.S{--s:#ffd166} .P{--s:#ff9f43} .I{--s:#ff6b5d} .N{--s:#ff4f8b}
.money{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:700 22px var(--f-display)}
.money .x{color:var(--muted);font-weight:500}
.money .r{color:var(--red)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.split div{padding:14px;border-radius:12px;border:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px}
.split .ok{border-color:color-mix(in srgb,var(--lime) 50%,var(--line))}
.split .no{border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:600;font-size:14px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.pick button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.pick .c[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--ink)}
.nav2{display:flex;gap:8px;justify-content:space-between}

/* personalizar */
details.persona{border:1px solid var(--line);border-radius:14px;background:var(--panel)}
details.persona summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;padding:12px 14px;flex-wrap:wrap}
details.persona summary::-webkit-details-marker{display:none}
details.persona .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;padding:0 14px 14px}
details.persona label{display:flex;flex-direction:column;gap:4px}
details.persona input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;font-size:14px}

/* home */
.now{border-color:color-mix(in srgb,var(--lime) 40%,var(--line));display:flex;flex-direction:column;gap:10px}
.now .time{font:700 42px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ladder{display:flex;flex-direction:column;gap:8px}
.ladder a{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.ladder a:hover{border-color:var(--line-2)}

/* aulas */
.lcard{padding:0;overflow:hidden}
.lcard .th{aspect-ratio:16/9;max-width:100%;background:#000 center/cover no-repeat;position:relative}
.lcard .th span{position:absolute;left:10px;bottom:10px}
.lcard .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.done-badge{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.player{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9;max-width:100%;position:relative}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:20px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85)),var(--img) center/cover}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.chapters{display:flex;flex-direction:column}
.chapters button{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;text-align:left;padding:9px 10px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--muted)}
.chapters button:hover{background:var(--panel-2);color:var(--text)}
.chapters .ts{font:500 13px var(--f-mono);color:var(--lime)}
.take{display:flex;flex-wrap:wrap;gap:8px}
.take span{padding:8px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2);font-weight:600;font-size:14px}

/* cadência */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.days button{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:var(--panel);cursor:pointer;color:var(--text)}
.days button b{font:700 18px/1 var(--f-display);color:var(--c)}
.days button small{font-size:12px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.days button[aria-pressed="true"] b,.days button[aria-pressed="true"] small{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.replies{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.replies div{padding:12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));display:flex;flex-direction:column;gap:2px}
.replies b{color:var(--c)}
.mini{display:flex;flex-wrap:wrap;gap:8px}
.mini span{padding:8px 11px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;color:var(--muted)}

/* rotina */
.agenda{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.slot .hr{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.slot .k{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px;background:var(--c)}
.slot.is-now{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.slot.is-past{opacity:.5}
.slot input{width:20px;height:20px;accent-color:var(--lime)}
.k-plan{--c:#c9cdd3} .k-msg{--c:var(--blue)} .k-call{--c:var(--lime)} .k-crm{--c:var(--violet)} .k-pause{--c:var(--red)} .k-fu{--c:var(--amber)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.tally .panel{display:flex;flex-direction:column;gap:8px;padding:14px}
.tally .num{font:700 36px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tally .num small{font-size:15px;color:var(--muted)}
.ctr{display:flex;gap:6px}
.ctr button{width:40px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;font-weight:700}

/* crm */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flow span{padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:14px}
.flow i{color:var(--lime);font-style:normal}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);z-index:20;background:var(--bg)}
  .brand .logos,.rail .prog{display:none}
  .brand b{font-size:16px;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;min-width:0}
  .nav a{white-space:nowrap;padding:8px 10px}
  .nav .dot{display:none}
  .lesson{grid-template-columns:minmax(0,1fr)}
  main{padding-block:20px 60px}
}
@media (max-width:520px){
  .slot{grid-template-columns:minmax(0,1fr) auto}
  .slot .hr{grid-column:1/-1}
  .track button{flex:1 0 56px;padding:0 1px}
  .track .n{width:34px;height:34px}
  .track button::before{top:16px}
  .track .l{font-size:10.5px}
  .bubble{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Navegação">
    <div class="brand"><b>Central Comercial</b><span class="logos"><img src="assets/logo_fexo_dark.png" alt="Fexô"><img class="cw" src="assets/logo_canaw.png" alt="Canaw"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="prog" id="railProg"></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>

<script src="conteudo.js"></script>
<script>
(function(){
const C = window.CONTEUDO;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('cc.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('cc.'+k, JSON.stringify(v)); }catch(e){} }
};
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* personalização */
const VARS = [['sdr','Seu nome','Luís'],['lead','Lead','Paulo'],['esp','Especialista','Paulinho'],['produto','Produto','Leilão PRO'],['data','Data','amanhã'],['horario','Horário','10h']];
const LABEL = Object.fromEntries(VARS.map(v=>[v[0],v[1]]));
let vars = store.get('vars', {});
const html = t => esc(t).replace(/\{(\w+)\}/g,(m,k)=> vars[k] ? '<span class="fill">'+esc(vars[k])+'</span>' : '<span class="tok">'+(LABEL[k]||k)+'</span>')
                       .replace(/\[([^\]]+)\]/g,'<span class="tok">$1</span>');
const plain = t => String(t).replace(/\{(\w+)\}/g,(m,k)=> vars[k] || '['+(LABEL[k]||k)+']');
let COPY = [];
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const cp = t => { COPY.push(t); return `<button class="cp" type="button" data-copy="${COPY.length-1}" aria-label="Copiar" title="Copiar">${ICON}</button>`; };
const say = (t, wa=false) => `<div class="say${wa?' wa':''}">${wa?'':'<span class="who">SDR</span>'}<div class="bubble">${html(t)}</div>${cp(t)}</div>`;

document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if(!b) return;
  const txt = plain(COPY[+b.dataset.copy]);
  const ok = () => { b.classList.add('ok'); b.innerHTML = '✓'; setTimeout(()=>{ b.classList.remove('ok'); b.innerHTML = ICON; }, 1300); };
  const sel = () => { const box = b.parentElement.querySelector('.bubble, span'); if(box){ const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } };
  try { navigator.clipboard.writeText(txt).then(ok, sel); } catch(err){ sel(); }
});

/* progresso */
const done = () => store.get('done', []);
const toggleDone = n => { let d = done(); d = d.includes(n) ? d.filter(x=>x!==n) : d.concat(n); store.set('done', d); };
function railProg(){ const d = done().length, t = C.aulas.length;
  $('#railProg').innerHTML = `<span class="mono">Formação · ${d}/${t}</span><div class="bar"><i style="width:${Math.round(d/t*100)}%"></i></div>`; }

const NAV = [['inicio','Início'],['trilha','Aulas'],['arsenal','Arsenal'],['spin','SPIN'],['cadencia','Follow-up'],['rotina','Meu dia'],['crm','CRM']];
const nav = active => $('#nav').innerHTML = NAV.map(([h,t])=>`<a href="#${h}" ${h===active?'aria-current="page"':''}><span class="dot"></span>${t}</a>`).join('');

const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const nowSlot = () => { const d = new Date(), m = d.getHours()*60+d.getMinutes(); return { i: C.rotina.findIndex(r => m >= toMin(r[0]) && m < toMin(r[1])), m }; };
const head = (kicker, title) => `<header class="stack" style="gap:8px"><span class="mono">${kicker}</span><h1>${title}</h1></header>`;
const V = {};

/* ---------------- início */
V.inicio = () => {
  const s = nowSlot(), r = C.rotina[s.i], d = done();
  const next = C.aulas.find(a=>!d.includes(a.n)) || C.aulas[0];
  return `${head('Time Paulinho dos Leilões','Central Comercial')}
  <section class="grid g2">
    <div class="panel now"><span class="mono">Agora</span><div class="time">${r ? r[0]+'–'+r[1] : '08:30'}</div><h2>${r ? esc(r[2]) : 'Amanhã: planejamento'}</h2><a class="btn go" href="#rotina" style="align-self:flex-start">Meu dia</a></div>
    <div class="panel stack"><span class="mono">Aula ${next.n} de ${C.aulas.length}</span><h2>${esc(next.titulo)}</h2><div class="bar"><i style="width:${Math.round(d.length/C.aulas.length*100)}%"></i></div><a class="btn" href="#${next.slug}" style="align-self:flex-start">${d.includes(next.n)?'Rever':'Continuar'}</a></div>
  </section>
  <section class="stack"><div class="row"><h2>Para quem eu ligo primeiro?</h2></div>
    <div class="ladder">${C.origens.map(o=>`<a href="#${o.slug}"><span class="prio">${o.prio}</span><span>${esc(o.titulo)}</span><span class="chip plat c-${o.cor}">${esc(o.plataforma)}</span></a>`).join('')}</div></section>`;
};

/* ---------------- aulas */
V.trilha = () => { const d = done();
  return `${head('Formação','Aulas')}<div class="grid g3">${C.aulas.map(a=>`<a class="tile lcard" href="#${a.slug}"><div class="th" style="background-image:url('${a.thumb}')"><span class="chip ${d.includes(a.n)?'done-badge':''}" style="${d.includes(a.n)?'':'background:rgba(0,0,0,.6)'}">${d.includes(a.n)?'Concluída':a.duracao}</span></div>
    <div class="bd"><span class="mono">Aula ${a.n}</span><h3>${esc(a.titulo)}</h3><p class="muted" style="font-size:14px">${esc(a.resumo)}</p></div></a>`).join('')}</div>`; };

function embed(url, start){
  if(!url) return null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  if(m) return {kind:'yt', html:`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0${start?`&start=${start}&autoplay=1`:''}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Aula"></iframe>`};
  m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(m) return {kind:'drive', html:`<iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay; fullscreen" allowfullscreen title="Aula"></iframe>`};
  return {kind:'mp4', html:`<video controls preload="metadata" src="${esc(url)}"></video>`};
}
function aulaView(a){
  const d = done(), e = embed(a.video, 0), prev = C.aulas[a.n-2], next = C.aulas[a.n];
  const player = e ? e.html : `<div class="ph" style="--img:url('${a.thumb}')"><span class="mono" style="color:var(--amber)">Vídeo em breve</span><h2>Aula ${a.n} · ${esc(a.titulo)}</h2></div>`;
  return `<div class="crumb"><a href="#trilha">Aulas</a><span class="mono">/ ${a.n}</span></div>
  ${head(a.resumo, esc(a.titulo))}
  <section class="lesson">
    <div class="stack" style="min-width:0">
      <div class="player" id="player" data-kind="${e?e.kind:''}">${player}</div>
      <div class="row"><button class="btn ${d.includes(a.n)?'':'go'}" type="button" id="markDone">${d.includes(a.n)?'Concluída ✓':'Marcar como concluída'}</button>
        <span class="spacer"></span>${prev?`<a class="btn sm" href="#${prev.slug}">← ${prev.n}</a>`:''}${next?`<a class="btn sm" href="#${next.slug}">${next.n} →</a>`:''}</div>
      <div class="take">${a.levar.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
      <a class="btn sm" href="#${a.ver[0]}" style="align-self:flex-start">Abrir: ${esc(a.ver[1])} →</a>
    </div>
    <aside class="panel" style="padding:10px"><span class="mono" style="display:block;padding:6px 10px">Capítulos · ${a.duracao}</span>
      <div class="chapters">${a.capitulos.map(([t,n])=>`<button type="button" data-seek="${t}"><span class="ts">${t}</span><span>${esc(n)}</span></button>`).join('')}</div></aside>
  </section>`;
}
function aulaMount(a){
  $('#markDone').onclick = () => { toggleDone(a.n); render(); };
  document.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => {
    const [m,s] = b.dataset.seek.split(':').map(Number), sec = m*60+s, p = $('#player');
    if(p.dataset.kind==='mp4'){ const v = p.querySelector('video'); v.currentTime = sec; v.play().catch(()=>{}); }
    else if(p.dataset.kind==='yt'){ p.innerHTML = embed(a.video, sec).html; }
    p.scrollIntoView({behavior:'smooth', block:'center'});
  });
}

/* ---------------- arsenal */
V.arsenal = () => `${head('Arsenal','Escolha a origem do lead')}
  <div class="ladder">${C.origens.map(o=>`<a href="#${o.slug}"><span class="prio">${o.prio}</span><span>${esc(o.titulo)}<br><span class="muted" style="font-weight:400;font-size:13px">${esc(o.objetivo)}</span></span><span class="chip plat c-${o.cor}">${esc(o.plataforma)}</span></a>`).join('')}</div>
  <div class="grid g3"><a class="tile" href="#spin"><span class="mono">Banco</span><h3>Perguntas SPIN</h3></a><a class="tile" href="#cadencia"><span class="mono">Não respondeu?</span><h3>Follow-up D7 → D90</h3></a><a class="tile" href="#crm"><span class="mono">Depois</span><h3>Nekta CRM</h3></a></div>`;

const STEPS = ['WhatsApp','Abertura','SPIN','Fechamento','CRM','Presença'];
let stepOf = {}, presOf = 0;
function personaBox(){
  const filled = VARS.filter(([k])=>vars[k]);
  return `<details class="persona" id="persona"><summary><span class="mono">Personalizar</span>${filled.length ? filled.map(([k])=>`<span class="chip" style="color:var(--lime)">${esc(vars[k])}</span>`).join('') : '<span class="muted" style="font-size:13px">preencha os nomes uma vez</span>'}<span class="spacer"></span><span class="mono">▾</span></summary>
    <div class="fields">${VARS.map(([k,l,ph])=>`<label><span class="mono" style="font-size:10px">${l}</span><input id="v-${k}" data-var="${k}" value="${esc(vars[k]||'')}" placeholder="${esc(ph)}" autocomplete="off"></label>`).join('')}</div></details>`;
}
function stage(o, i){
  const f = o.fecha;
  if(i===0) return `<span class="hint">Em até 5 minutos</span>${say(o.wa, true)}`;
  if(i===1) return `<span class="hint">Respondeu ou não: ligue</span>${say(o.abertura)}${say(o.direcao || C.direcao)}`;
  if(i===2) return `<span class="hint">1–2 por etapa · escute</span><div class="spin4">${['S','P','I','N'].map(L=>`<div class="sp ${L}"><div class="row"><span class="L">${L}</span><span class="mono">${C.spin[L].nome}</span></div>${o.spin[L].map(q=>`<div class="q"><span>${html(q)}</span>${cp(q)}</div>`).join('')}</div>`).join('')}</div>
    <div class="money"><span>${C.numeros[0]}</span><span class="x">× ${C.numeros[1]} =</span><span class="r">${C.numeros[2]}</span></div>`;
  if(i===3) return `<span class="hint">${o.confirma ? 'Confirme em voz alta' : 'Dois horários, nunca pergunta aberta'}</span>${say(f.resumo)}${say(f.proposta)}${say(f.compromisso)}<span class="hint warn">Nunca "te mando o link depois"</span>`;
  if(i===4) return `<span class="hint">Registre em até 5 min</span><div class="tags">${C.crm.registro.map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="split"><div class="ok"><b>Agendou</b><span class="muted">Agenda do CRM + contexto</span></div><div class="no"><b>Não agendou</b><span class="muted">Desqualificado</span></div></div>`;
  return `<span class="hint">Grupo: você + Closer + lead</span><div class="pick" role="group" aria-label="Momento">${C.presenca.map(([k],j)=>`<button type="button" data-pres="${j}" aria-pressed="${j===presOf}">${k}</button>`).join('')}</div>
    ${say(C.presenca[presOf][1], true)}<a class="btn sm" href="#cadencia" style="align-self:flex-start">Não respondeu? Follow-up →</a>`;
}
function origemView(o){
  const i = stepOf[o.slug] || 0;
  return `<div class="crumb"><a href="#arsenal">Arsenal</a><span class="mono">/ ${o.prio}</span></div>
  <header class="stack" style="gap:10px"><div class="row"><span class="prio">${o.prio}</span><span class="chip plat c-${o.cor}">${esc(o.plataforma)}</span><span class="chip">→ ${esc(o.destino)}</span></div>
    <h1>${esc(o.titulo)}</h1><p class="muted" style="font-size:16px">${esc(o.objetivo)}</p>${o.aviso?`<span class="hint warn">${esc(o.aviso)}</span>`:''}</header>
  ${personaBox()}
  <div class="track" role="list">${STEPS.map((s,j)=>`<button type="button" role="listitem" data-step="${j}" class="${j<i?'past':''}" ${j===i?'aria-current="step"':''}><span class="n">${j+1}</span><span class="l">${s}</span></button>`).join('')}</div>
  <section class="stage" id="stage">${stage(o, i)}</section>
  <div class="nav2"><button class="btn" type="button" data-move="-1" ${i===0?'disabled style="opacity:.4"':''}>← Voltar</button><button class="btn go" type="button" data-move="1" ${i===STEPS.length-1?'disabled style="opacity:.4"':''}>Próxima etapa →</button></div>`;
}
function origemMount(o){
  const go = j => { stepOf[o.slug] = Math.max(0, Math.min(STEPS.length-1, j)); render(); };
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => go(+b.dataset.step));
  document.querySelectorAll('[data-move]').forEach(b => b.onclick = () => go((stepOf[o.slug]||0) + (+b.dataset.move)));
  document.querySelectorAll('[data-pres]').forEach(b => b.onclick = () => { presOf = +b.dataset.pres; render(); });
  const det = $('#persona'); if(store.get('personaOpen', false)) det.open = true;
  det.addEventListener('toggle', () => store.set('personaOpen', det.open));
  document.querySelectorAll('[data-var]').forEach(inp => inp.addEventListener('input', () => {
    vars[inp.dataset.var] = inp.value.trim(); store.set('vars', vars); COPY = []; $('#stage').innerHTML = stage(o, stepOf[o.slug]||0);
    document.querySelectorAll('[data-pres]').forEach(b => b.onclick = () => { presOf = +b.dataset.pres; render(); });
  }));
}

/* ---------------- SPIN */
let pf = store.get('pf', 'todos');
V.spin = () => {
  const PF = [['todos','Todos'],['moradia','Moradia'],['investimento','Investimento'],['profissao','Nova profissão']];
  const show = t => pf==='todos' || t==='todos' || t===pf;
  return `${head('Aula 4','Perguntas SPIN')}
  <div class="pick" role="group" aria-label="Público">${PF.map(([k,l])=>`<button type="button" data-pf="${k}" aria-pressed="${pf===k}">${l}</button>`).join('')}</div>
  <div class="spin4">${['S','P','I','N'].map(L=>{ const s = C.spin[L]; return `<div class="sp ${L}"><div class="row"><span class="L">${L}</span><span class="mono">${s.nome}</span></div><span class="hint" style="color:var(--s);background:color-mix(in srgb,var(--s) 12%,transparent)">${s.dica}</span>
    ${s.q.filter(([t])=>show(t)).map(([t,q])=>`<div class="q"><span>${esc(q)}</span>${cp(q)}</div>`).join('')}</div>`; }).join('')}</div>
  <div class="money"><span>${C.numeros[0]}</span><span class="x">× ${C.numeros[1]} =</span><span class="r">${C.numeros[2]}</span></div>
  <section class="stack"><h2>Postura</h2><div class="replies">${C.postura.map(([t,b])=>`<div class="c-lime"><b>${t}</b><span class="muted" style="font-size:13.5px">${b}</span></div>`).join('')}</div></section>`;
};

/* ---------------- follow-up */
let dayOf = 0, ghostOf = 0;
V.cadencia = () => { const d = C.cadencia[dayOf];
  return `${head('Aula 5','Follow-up')}
  <div class="legend"><span class="c-amber"><i></i>Repescagem</span><span class="c-blue"><i></i>Nutrição</span><span class="c-violet"><i></i>Longo prazo</span></div>
  <div class="days" role="group" aria-label="Dia">${C.cadencia.map(([dd,n,c],j)=>`<button type="button" class="c-${c}" data-day="${j}" aria-pressed="${j===dayOf}"><b>${dd}</b><small>${n}</small></button>`).join('')}</div>
  <section class="stage" style="min-height:0">${say(d[3], true)}</section>
  <section class="stack"><h2>Respondeu?</h2><div class="replies">${C.respostas.map(([,t,b,c])=>`<div class="c-${c}"><b>${t}</b><span class="muted" style="font-size:13.5px">${b}</span></div>`).join('')}</div></section>
  <section class="stack"><h2>Sumiu no meio da conversa?</h2>
    <div class="pick" role="group" aria-label="Anti-ghosting">${C.ghost.map(([k],j)=>`<button type="button" data-ghost="${j}" aria-pressed="${j===ghostOf}">${k}</button>`).join('')}<button type="button" disabled style="opacity:.6">→ volta ao D14</button></div>
    ${say(C.ghost[ghostOf][1], true)}</section>
  <section class="stack"><h2>Regras</h2><div class="mini">${C.regras.map(r=>`<span>${r}</span>`).join('')}</div></section>`; };
function cadMount(){
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { dayOf = +b.dataset.day; render(); });
  document.querySelectorAll('[data-ghost]').forEach(b => b.onclick = () => { ghostOf = +b.dataset.ghost; render(); });
}

/* ---------------- meu dia */
V.rotina = () => {
  const key = today(), day = store.get('day.'+key, {slots:[], tally:{}}), s = nowSlot();
  return `${head('Aula 6','Meu dia')}
  <div class="tally">${C.metas.map(([k,l,alvo])=>{ const v = day.tally[k]||0; return `<div class="panel"><span class="mono">${l}</span><div class="num">${v}<small> / ${alvo}${k==='agendamentos'?'–6':''}</small></div>
    <div class="bar"><i style="width:${Math.min(100,Math.round(v/alvo*100))}%"></i></div><div class="ctr"><button type="button" data-t="${k}" data-d="-1" aria-label="Menos ${l}">−</button><button type="button" data-t="${k}" data-d="1" aria-label="Mais ${l}">+1</button></div></div>`; }).join('')}</div>
  <div class="agenda">${C.rotina.map((r,i)=>{ const cls = i===s.i ? 'is-now' : (s.m >= toMin(r[1]) ? 'is-past' : '');
    return `<label class="slot ${cls}"><span class="hr">${r[0]}–${r[1]}</span><b><span class="k k-${r[3]}"></span>${esc(r[2])}${i===s.i?' <span class="chip" style="color:var(--lime);border-color:var(--lime);margin-left:6px">agora</span>':''}</b><input type="checkbox" id="slot-${i}" data-slot="${i}" ${day.slots.includes(i)?'checked':''} aria-label="Feito: ${esc(r[2])}"></label>`; }).join('')}</div>
  <div class="mini">${C.regrasDia.map(r=>`<span>${r}</span>`).join('')}</div>`;
};
function rotinaMount(){ const key = 'day.'+today();
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const d = store.get(key, {slots:[], tally:{}}), k = b.dataset.t; d.tally[k] = Math.max(0, (d.tally[k]||0) + (+b.dataset.d)); store.set(key, d); render(); });
  document.querySelectorAll('[data-slot]').forEach(c => c.onchange = () => { const d = store.get(key, {slots:[], tally:{}}), i = +c.dataset.slot; d.slots = c.checked ? d.slots.concat(i) : d.slots.filter(x=>x!==i); store.set(key, d); });
}

/* ---------------- crm */
V.crm = () => `${head('Aula 3','Nekta CRM')}
  <section class="stack"><span class="mono">Caminho do lead</span><div class="flow">${C.crm.fluxo.map(x=>`<span>${x}</span>`).join('<i>→</i>')}</div></section>
  <section class="stack"><span class="mono">Pipeline</span><div class="flow">${C.crm.etapas.map(x=>`<span>${x}</span>`).join('<i>→</i>')}</div></section>
  <section class="grid g2"><div class="panel stack"><span class="mono">Ao agendar</span><div class="tags">${C.crm.agenda.map(x=>`<span>${x}</span>`).join('')}</div></div>
    <div class="panel stack"><span class="mono">Depois da ligação · 5 min</span><div class="tags">${C.crm.registro.map(x=>`<span>${x}</span>`).join('')}</div></div></section>`;

/* ---------------- router */
function render(){
  COPY = [];
  const h = (location.hash || '#inicio').slice(1);
  const a = C.aulas.find(x=>x.slug===h), o = C.origens.find(x=>x.slug===h);
  let active = h, out;
  if(a){ out = aulaView(a); active = 'trilha'; } else if(o){ out = origemView(o); active = 'arsenal'; }
  else if(V[h]){ out = V[h](); } else { out = V.inicio(); active = 'inicio'; }
  nav(active); railProg(); $('#view').innerHTML = out;
  if(a) aulaMount(a); if(o) origemMount(o);
  if(h==='spin') document.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { pf = b.dataset.pf; store.set('pf', pf); render(); });
  if(h==='cadencia') cadMount(); if(h==='rotina') rotinaMount();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
render();
setInterval(() => { const h = (location.hash||'#inicio').slice(1); if(h==='inicio' || h==='rotina'){ const y = scrollY; render(); scrollTo(0,y); } }, 60000);
})();
</script>
</body>
</html>
