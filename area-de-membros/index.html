<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Comercial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Plataforma de onboarding em tom de streaming: barra superior fina, destaque "continue assistindo" em tela larga,
   grade de capas 16:9 e página de aula com o cenário do episódio ao fundo. Mesma identidade das capas (grafite + cor do episódio). */
:root{
  --bg:#07080a; --panel:#0f1114; --panel-2:#15181c; --line:#22262c; --line-2:#2f343c;
  --text:#f2f4f6; --muted:#9aa0a9; --faint:#6b717a;
  --lime:#c8f43c; --ink:#0a0b0d;
  --f-display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.mono{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.inner{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(7,8,10,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .inner{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand b{font:700 18px/1 var(--f-display);white-space:nowrap}
.brand .sep{width:1px;height:22px;background:var(--line-2)}
.brand img.f{height:16px} .brand img.c{height:30px;border-radius:6px}
.tabs{display:flex;gap:4px;margin-left:10px}
.tabs a{padding:8px 12px;border-radius:9px;color:var(--muted);font-weight:500}
.tabs a[aria-current="page"]{color:var(--text);background:var(--panel-2)}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);white-space:nowrap}
.prog .bar{width:120px}
.bar{height:5px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:4px}

/* destaque */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .scene{position:absolute;inset:0;background:var(--img) right center/cover no-repeat;opacity:.9;transform:scale(1.04)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(7,8,10,.94) 30%,rgba(7,8,10,.55) 62%,rgba(7,8,10,.25) 100%),linear-gradient(0deg,var(--bg) 0%,rgba(7,8,10,0) 45%)}
.hero .glow{position:absolute;left:-240px;top:-260px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 62%);opacity:.16}
.hero .inner{position:relative;padding-block:clamp(48px,8vw,104px) clamp(40px,6vw,72px);display:flex;flex-direction:column;gap:18px}
.hero .k{display:flex;align-items:center;gap:12px;font:500 13px var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--c)}
.hero .k i{width:36px;height:2px;background:var(--c)}
.hero h1{font-size:clamp(36px,6vw,72px);line-height:.98;max-width:12ch}
.hero p{font-size:clamp(16px,1.6vw,19px);color:#c9ced5;max-width:46ch}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 12.5px var(--f-mono);letter-spacing:.06em;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:#dfe3e8;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.play{background:var(--c,var(--lime));border-color:var(--c,var(--lime));color:var(--ink)}
.btn.play:hover{filter:brightness(1.08)}
.tri{width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
.hero .bar{background:rgba(255,255,255,.12)}

/* grade */
.section{padding-block:40px 16px;display:flex;flex-direction:column;gap:20px}
.section .head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.section h2{font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:22px}
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.cover{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0) 45%);opacity:0;transition:opacity .3s}
.cover .over{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .3s;z-index:1}
.cover .over span{width:62px;height:62px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:var(--ink);box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 25%,transparent)}
.cover .over .tri{border-left-width:16px;border-top-width:10px;border-bottom-width:10px;margin-left:5px}
.card:hover .cover img{transform:scale(1.05)}
.card:hover .cover::after,.card:hover .cover .over,.card:focus-visible .cover .over{opacity:1}
.card:hover .cover{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.cover .done{position:absolute;top:12px;right:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--lime);color:var(--ink);font:600 12px var(--f-body)}
.cover .line{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c);z-index:2}
.card .info{display:flex;flex-direction:column;gap:4px;padding:0 2px}
.card .info .row{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.card .info .row b{font:500 12px var(--f-mono);letter-spacing:.14em;color:var(--c)}
.card h3{font-size:19px;line-height:1.25}
.card p{color:var(--muted);font-size:14px}

/* página da aula */
.stage{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.stage .scene{position:absolute;inset:-40px;background:var(--img) center/cover;filter:blur(36px) saturate(1.2);opacity:.38}
.stage .shade{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(7,8,10,.6) 40%,rgba(7,8,10,.75) 100%)}
.stage .inner{position:relative;padding-block:24px 34px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.crumb{grid-column:1/-1;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.crumb a:hover{color:var(--text)}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#000 var(--thumb) center/cover;border:1px solid var(--line-2);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.player iframe,.player video,.player img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.chap{background:rgba(15,17,20,.82);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;max-height:min(70vh,560px);min-width:0}
.chap .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.chap .list{overflow:auto;display:flex;flex-direction:column;gap:2px}
.chap button{display:grid;grid-template-columns:22px 54px minmax(0,1fr);gap:8px;align-items:center;text-align:left;padding:10px;border:0;background:none;border-radius:10px;cursor:pointer;color:#cfd3d9}
.chap button:hover{background:var(--panel-2);color:var(--text)}
.chap button .i{font:500 11px var(--f-mono);color:var(--faint)}
.chap button .ts{font:500 12.5px var(--f-mono);color:var(--c)}
.below{padding-block:30px 60px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.title{display:flex;flex-direction:column;gap:12px;min-width:0}
.title .k{font:500 12.5px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.title h1{font-size:clamp(28px,3.4vw,40px);line-height:1.08}
.title p{color:var(--muted);font-size:17px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.takes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:22px}
.takes div{padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.takes b{font:700 13px var(--f-mono);color:var(--c)}
.takes span{font-weight:500;line-height:1.4}
.next{display:flex;flex-direction:column;gap:12px;min-width:0}
.mini{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.mini:hover{border-color:var(--line-2)}
.mini img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;display:block}
.mini .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .t b{font-size:14px;line-height:1.3}
.mini .t small{color:var(--muted);font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}

footer{border-top:1px solid var(--line);padding-block:26px;color:var(--faint);font-size:13px}

@media (max-width:980px){
  .stage .inner,.below{grid-template-columns:minmax(0,1fr)}
  .chap{max-height:none}
}
@media (max-width:640px){
  .brand .sep,.brand img,.prog{display:none}
  .top .inner{height:56px;gap:10px}
  .tabs{margin-left:0}
  .hero .scene{background-position:70% center;opacity:.55}
  .grid{gap:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="inner">
  <a class="brand" href="#onboarding"><b>Central Comercial</b><span class="sep"></span><img class="f" src="assets/logo_fexo_dark.png" alt="Fexô"><img class="c" src="assets/logo_canaw.png" alt="Canaw"></a>
  <nav class="tabs" aria-label="Navegação"><a href="#onboarding" aria-current="page">Onboarding</a></nav>
  <span class="spacer"></span>
  <span class="prog" id="prog"></span>
</div></header>
<main id="view"></main>
<footer><div class="inner">Central Comercial · Time Paulinho dos Leilões · Fexô e Canaw</div></footer>

<script src="conteudo.js"></script>
<script>
(function(){
const A = window.CONTEUDO.aulas;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k,d){ try{ const v = localStorage.getItem('cc.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem('cc.'+k, JSON.stringify(v)); }catch(e){} } };
const done = () => store.get('done', []);
const toggle = n => { let d = done(); d = d.includes(n) ? d.filter(x=>x!==n) : d.concat(n); store.set('done', d); };
const pad = n => String(n).padStart(2,'0');
const mins = Math.round(A.reduce((t,a)=>{ const [m,s] = a.duracao.split(':').map(Number); return t+m+s/60; },0));
const tri = '<span class="tri" aria-hidden="true"></span>';

function prog(){ const d = done().length;
  $('#prog').innerHTML = `<span>${d} de ${A.length} concluídas</span><span class="bar"><i style="width:${Math.round(d/A.length*100)}%"></i></span>`; }

function home(){
  const d = done(); const next = A.find(a=>!d.includes(a.n)) || A[0]; const started = d.length > 0;
  const card = a => `<a class="card" href="#${a.slug}" style="--c:${a.cor}">
      <div class="cover"><img src="${a.thumb}" alt="Capa do onboarding ${a.n}: ${esc(a.titulo)}" loading="lazy">${d.includes(a.n)?'<span class="done">✓ Concluída</span>':''}<div class="over"><span>${tri}</span></div>${d.includes(a.n)?'<span class="line"></span>':''}</div>
      <div class="info"><div class="row"><b>ONBOARDING ${pad(a.n)}</b><span>${a.duracao} min · ${a.capitulos.length} capítulos</span></div><h3>${esc(a.titulo)}</h3><p>${esc(a.resumo)}</p></div></a>`;
  return `<section class="hero" style="--img:url('${next.cena}');--c:${next.cor}"><div class="scene"></div><div class="shade"></div><div class="glow"></div>
    <div class="inner"><span class="k"><i></i>${started ? 'Continue de onde parou' : 'Comece por aqui'} · Onboarding ${pad(next.n)}</span>
      <h1>${esc(next.titulo)}</h1><p>${esc(next.resumo)}</p>
      <div class="meta"><a class="btn play" href="#${next.slug}">${tri}Assistir onboarding ${pad(next.n)}</a><span class="pill">${next.duracao} min</span><span class="pill">${next.capitulos.length} capítulos</span></div>
      <div class="meta" style="gap:14px;margin-top:6px;max-width:460px"><span class="mono">Onboarding · ${d.length}/${A.length}</span><div class="bar" style="flex:1;min-width:120px"><i style="width:${Math.round(d.length/A.length*100)}%"></i></div></div></div></section>
  <div class="inner section"><div class="head"><h2>Onboarding do time comercial</h2><span class="mono">${A.length} vídeos · ${mins} min</span></div>
    <div class="grid">${A.map(card).join('')}</div></div>`;
}

function embed(url, start){
  if(!url) return null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  if(m) return {kind:'yt', html:`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&modestbranding=1${start?`&start=${start}&autoplay=1`:''}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Onboarding"></iframe>`};
  m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(m) return {kind:'drive', html:`<iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay; fullscreen" allowfullscreen title="Onboarding"></iframe>`};
  return {kind:'mp4', html:`<video controls preload="metadata" src="${esc(url)}"></video>`};
}
function lesson(a){
  const d = done(), e = embed(a.video, 0), prev = A[a.n-2], next = A[a.n];
  const mini = (x, label) => x ? `<a class="mini" href="#${x.slug}" style="--c:${x.cor}"><img src="${x.thumb}" alt=""><span class="t"><small>${label} · Onboarding ${pad(x.n)}</small><b>${esc(x.titulo)}</b></span></a>` : '';
  return `<section class="stage" style="--img:url('${a.cena}');--c:${a.cor}"><div class="scene"></div><div class="shade"></div>
    <div class="inner"><div class="crumb"><a href="#onboarding">Onboarding</a><span>›</span><span>Onboarding ${pad(a.n)}</span></div>
      <div class="player" id="player" data-kind="${e?e.kind:''}" style="--thumb:url('${a.thumb}')">${e ? e.html : `<img src="${a.thumb}" alt="">`}</div>
      <aside class="chap"><div class="hd"><span class="mono">Capítulos</span><span class="mono">${a.duracao}</span></div>
        <div class="list">${a.capitulos.map(([t,n],i)=>`<button type="button" data-seek="${t}"><span class="i">${pad(i+1)}</span><span class="ts">${t}</span><span>${esc(n)}</span></button>`).join('')}</div></aside></div></section>
  <div class="inner below" style="--c:${a.cor}">
    <div class="title"><span class="k">Onboarding ${pad(a.n)} de ${pad(A.length)}</span><h1>${esc(a.titulo)}</h1><p>${esc(a.resumo)}</p>
      <div class="actions"><button class="btn ${d.includes(a.n)?'':'play'}" type="button" id="markDone">${d.includes(a.n)?'✓ Concluída':'Marcar como concluída'}</button>${next?`<a class="btn" href="#${next.slug}">Próximo →</a>`:''}</div>
      <div class="takes">${a.levar.map((x,i)=>`<div><b>${pad(i+1)}</b><span>${esc(x)}</span></div>`).join('')}</div></div>
    <div class="next"><span class="mono">Continue no onboarding</span>${mini(next,'Próxima')}${mini(prev,'Anterior')}</div>
  </div>`;
}
function lessonMount(a){
  $('#markDone').onclick = () => { toggle(a.n); render(); };
  document.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => {
    const [m,s] = b.dataset.seek.split(':').map(Number), sec = m*60+s, p = $('#player');
    if(p.dataset.kind==='mp4'){ const v = p.querySelector('video'); v.currentTime = sec; v.play().catch(()=>{}); }
    else if(p.dataset.kind==='yt'){ p.innerHTML = embed(a.video, sec).html; }
    p.scrollIntoView({behavior:'smooth', block:'center'});
  });
}
function render(){
  const h = (location.hash||'').slice(1), a = A.find(x=>x.slug===h);
  prog(); $('#view').innerHTML = a ? lesson(a) : home(); if(a) lessonMount(a);
}
window.addEventListener('hashchange', () => { render(); scrollTo(0,0); });
render();
})();
</script>
</body>
</html>
