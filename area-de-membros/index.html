<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Comercial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: trilho lateral fixo (navegação) + coluna de trabalho; no celular o trilho vira faixa de abas rolável no topo.
   Identidade: a mesma da série de aulas — fundo grafite, sinal verde-limão para "fazer agora", vermelho para Canaw. */
:root{
  --bg:#0a0b0d; --panel:#111317; --panel-2:#171a1f; --line:#252930; --line-2:#323741;
  --text:#eef0f3; --muted:#9097a1; --faint:#5f6670;
  --lime:#c8f43c; --red:#ff5a4d; --amber:#ffb547; --blue:#6aa0ff; --violet:#b9a2ff;
  --lime-ink:#11140a;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px);line-height:1.08}
h2{font-size:22px;line-height:1.2}
h3{font-size:17px;line-height:1.3}
p{margin:0}
.mono{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);padding:22px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.brand b{font:700 19px/1 var(--f-display)}
.brand .logos{display:flex;align-items:center;gap:10px;opacity:.9}
.brand .logos img{height:18px}
.brand .logos img.cw{height:30px;border-radius:5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a[aria-current="page"]{background:var(--panel-2);color:var(--text)}
.nav a[aria-current="page"] .dot{background:var(--lime)}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.rail .prog{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:4px}

main{min-width:0;padding-block:32px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.crumb{display:flex;gap:8px;align-items:center}
.crumb a{text-decoration:none;color:var(--muted)}
.crumb a:hover{color:var(--text)}
.lead-p{color:var(--muted);font-size:17px;max-width:62ch}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .15s,transform .15s;min-width:0}
.tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.chip{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip.wrap{white-space:normal;line-height:1.35;text-transform:none;letter-spacing:.02em;font-family:var(--f-body);font-size:12.5px}
.prio{font:700 13px/1 var(--f-display);padding:6px 9px;border-radius:8px;background:var(--amber);color:#1a1205;letter-spacing:.02em}
.c-lime{--c:var(--lime)} .c-red{--c:var(--red)} .c-violet{--c:var(--violet)} .c-amber{--c:var(--amber)} .c-blue{--c:var(--blue)} .c-muted{--c:var(--muted)}
.chip.plat{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);text-decoration:none;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:stretch}
.hero .panel{display:flex;flex-direction:column;gap:14px}
.now{border-color:color-mix(in srgb,var(--lime) 40%,var(--line))}
.now .time{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ladder{display:flex;flex-direction:column;gap:8px}
.ladder a{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.ladder a:hover{border-color:var(--line-2)}
.ladder .t{font-weight:600}
.ladder .s{color:var(--muted);font-size:13px}

/* aulas */
.lesson-card{padding:0;overflow:hidden}
.lesson-card .th{aspect-ratio:16/9;max-width:100%;background:#000 center/cover no-repeat;position:relative}
.lesson-card .th span{position:absolute;left:12px;bottom:12px}
.lesson-card .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.done-badge{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.player{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9;max-width:100%;position:relative}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:22px;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.82)),var(--img) center/cover}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.chapters{display:flex;flex-direction:column}
.chapters button{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;text-align:left;padding:10px 12px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--muted)}
.chapters button:hover{background:var(--panel-2);color:var(--text)}
.chapters .ts{font:500 13px var(--f-mono);color:var(--lime);font-variant-numeric:tabular-nums}
ul.take{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.take li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px}
ul.take li::before{content:"";width:8px;height:8px;margin-top:7px;border-radius:2px;background:var(--lime)}

/* arsenal */
.origin{display:flex;flex-direction:column;gap:12px}
.origin .who{color:var(--muted);font-size:14px}
.persona{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.persona .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.persona label{display:flex;flex-direction:column;gap:4px}
.persona input{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;font-size:14px}
.steps{display:flex;flex-direction:column;gap:14px;counter-reset:step}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px}
.step .n{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 16px var(--f-display);background:var(--panel-2);border:1px solid var(--line-2)}
.step .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.script{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.script .txt{font-size:15.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.script.say{border-left:3px solid var(--lime)}
.script.wa{border-left:3px solid #25d366}
.tok{color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent);border-radius:4px;padding:0 2px}
.fill{color:var(--lime)}
.copy{align-self:flex-start}
.copy.ok{border-color:var(--lime);color:var(--lime)}
.spin-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.spin-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.spin-col h3{display:flex;gap:10px;align-items:baseline}
.spin-col h3 b{font:700 26px/1 var(--f-display)}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.q .copy{font-size:12px}
.S{--s:#ffd166} .P{--s:#ff9f43} .I{--s:#ff6b5d} .N{--s:#ff4f8b}
.spin-col h3 b{color:var(--s)}
.spin-col .q{border-top:2px solid color-mix(in srgb,var(--s) 70%,transparent)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--red) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:none;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* cadência */
.cad{display:flex;flex-direction:column;gap:12px}
.touch{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:start}
.touch .d{font:700 26px/1 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums}
.timeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.timeline span{flex:none;padding:6px 10px;border-radius:8px;font:500 12px var(--f-mono);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);color:var(--c)}

/* rotina */
.agenda{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.slot .hr{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.slot .k{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px;background:var(--c)}
.slot.is-now{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.slot.is-past{opacity:.55}
.slot input{width:20px;height:20px;accent-color:var(--lime)}
.k-plan{--c:#c9cdd3} .k-msg{--c:var(--blue)} .k-call{--c:var(--lime)} .k-crm{--c:var(--violet)} .k-pause{--c:var(--red)} .k-fu{--c:var(--amber)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.tally .panel{display:flex;flex-direction:column;gap:10px}
.tally .num{font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tally .num small{font-size:16px;color:var(--muted)}
.ctr{display:flex;gap:6px}
.ctr button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;font-weight:700}
.rules{counter-reset:r;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;padding:0;margin:0;list-style:none}
.rules li{counter-increment:r;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rules li::before{content:counter(r,decimal-leading-zero);font:500 12px var(--f-mono);color:var(--lime);padding-top:3px}

/* crm */
.flow{display:flex;flex-direction:column;gap:0}
.flow li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.flow li::before{content:counter(f);counter-increment:f;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--f-display);background:var(--panel-2);border:1px solid var(--line-2)}
.flow li:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.flow{counter-reset:f;padding:0;margin:0;list-style:none}
.pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.pipe span{flex:none;padding:8px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);font-size:13px;font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:8px}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);z-index:20}
  .brand .logos,.rail .prog,.nav .sep,.brand .mono{display:none}
  .brand b{font-size:16px;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;min-width:0}
  .nav a{white-space:nowrap;padding:8px 10px}
  .nav .dot{display:none}
  .hero,.lesson{grid-template-columns:minmax(0,1fr)}
  .persona{top:calc(env(safe-area-inset-top,0px) + 58px)}
  main{padding-block:22px 60px}
}
@media (max-width:520px){
  .slot{grid-template-columns:minmax(0,1fr) auto}
  .slot .hr{grid-column:1/-1}
  .step{grid-template-columns:minmax(0,1fr)}
  .touch{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail" aria-label="Navegação">
    <div class="brand">
      <span class="mono">Time Paulinho dos Leilões</span>
      <b>Central Comercial</b>
      <span class="logos"><img src="assets/logo_fexo_dark.png" alt="Fexô"><img class="cw" src="assets/logo_canaw.png" alt="Canaw"></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="prog" id="railProg"></div>
  </aside>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>

<script src="conteudo.js"></script>
<script>
(function(){
const C = window.CONTEUDO;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('cc.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('cc.'+k, JSON.stringify(v)); }catch(e){} }
};
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* ------------------------------------------------ personalização dos scripts */
const VARS = [['sdr','Seu nome','Ex.: Luís'],['lead','Nome do lead','Ex.: Paulo'],['esp','Especialista','Ex.: Paulinho dos Leilões'],['produto','Produto','Ex.: Leilão PRO'],['data','Data da reunião','Ex.: amanhã'],['horario','Horário','Ex.: 10h']];
const LABEL = Object.fromEntries(VARS.map(v=>[v[0],v[1]]));
let vars = store.get('vars', {});
const html = t => esc(t).replace(/\{(\w+)\}/g,(m,k)=> vars[k] ? '<span class="fill">'+esc(vars[k])+'</span>' : '<span class="tok">['+(LABEL[k]||k)+']</span>')
                       .replace(/\[([^\]]+)\]/g,(m,k)=> m.startsWith('<') ? m : '<span class="tok">['+k+']</span>');
const plain = t => String(t).replace(/\{(\w+)\}/g,(m,k)=> vars[k] || '['+(LABEL[k]||k)+']');
let COPY = []; const copyBtn = (t, label='Copiar') => { COPY.push(t); return `<button class="btn sm copy" type="button" data-copy="${COPY.length-1}">${label}</button>`; };
const script = (t, kind='say') => `<div class="script ${kind}"><div class="txt">${html(t)}</div>${copyBtn(t)}</div>`;

document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if(!b) return;
  const txt = plain(COPY[+b.dataset.copy]);
  const ok = () => { const o = b.textContent; b.textContent = 'Copiado'; b.classList.add('ok'); setTimeout(()=>{ b.textContent = o; b.classList.remove('ok'); }, 1400); };
  const fallback = () => { const box = b.parentElement.querySelector('.txt'); if(box){ const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selecionado: Ctrl+C'; } };
  try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch(err){ fallback(); }
});

/* ------------------------------------------------------- progresso das aulas */
const done = () => store.get('done', []);
const toggleDone = n => { let d = done(); d = d.includes(n) ? d.filter(x=>x!==n) : d.concat(n); store.set('done', d); };
function railProg(){
  const d = done().length, t = C.aulas.length;
  $('#railProg').innerHTML = `<span class="mono">Formação</span><div class="row"><b>${d} de ${t} aulas</b></div><div class="bar"><i style="width:${Math.round(d/t*100)}%"></i></div>`;
}

/* ------------------------------------------------------------------- nav */
const NAV = [['inicio','Início'],['trilha','Aulas'],['arsenal','Arsenal'],['spin','Perguntas SPIN'],['cadencia','Follow-up'],['rotina','Meu dia'],['crm','Nekta CRM']];
function nav(active){
  $('#nav').innerHTML = NAV.map(([h,t],i)=> (i===3?'<div class="sep"></div>':'') + `<a href="#${h}" ${h===active?'aria-current="page"':''}><span class="dot"></span>${t}</a>`).join('');
}

/* ---------------------------------------------------------------- helpers */
const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
function nowSlot(){
  const d = new Date(), m = d.getHours()*60+d.getMinutes();
  const i = C.rotina.findIndex(r => m >= toMin(r[0]) && m < toMin(r[1]));
  return { i, m };
}
const origin = slug => C.origens.find(o=>o.slug===slug);
const lessonLinks = ns => ns.map(n=>{ const a=C.aulas[n-1]; return `<a class="chip" href="#${a.slug}">Aula ${n} · ${esc(a.titulo)}</a>`; }).join('');

/* ------------------------------------------------------------------ views */
const V = {};

V.inicio = () => {
  const s = nowSlot(); const r = C.rotina[s.i];
  const d = done(); const next = C.aulas.find(a=>!d.includes(a.n)) || C.aulas[0];
  const nowBox = r ? `<span class="mono">Agora na sua rotina</span><div class="time">${r[0]}–${r[1]}</div><h2>${esc(r[2])}</h2><p class="lead-p" style="font-size:15px">${esc(r[4])}</p>`
                   : `<span class="mono">Fora do expediente</span><div class="time">08:30</div><h2>Amanhã começa com o planejamento</h2><p class="lead-p" style="font-size:15px">Revise as metas, alinhe CRM e agenda e priorize leads quentes e retornos.</p>`;
  return `
  <header class="row"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span class="mono">Central comercial de performance e treinamento</span>
    <h1>O que você precisa para vender, em um só lugar.</h1>
    <p class="lead-p">Assista às 6 aulas da formação e use o Arsenal durante as ligações: um roteiro pronto para cada origem de lead, com as perguntas SPIN, o fechamento e as mensagens de follow-up.</p></div></header>
  <section class="hero">
    <div class="panel now">${nowBox}<div class="row"><a class="btn go" href="#rotina">Abrir Meu dia</a></div></div>

function embed(url, start){
  if(!url) return null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  if(m) return {kind:'yt', html:`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0${start?`&start=${start}&autoplay=1`:''}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Aula"></iframe>`};
  m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(m) return {kind:'drive', html:`<iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay; fullscreen" allowfullscreen title="Aula"></iframe>`};
  return {kind:'mp4', html:`<video controls preload="metadata" src="${esc(url)}"></video>`};
}

    <div class="panel" style="display:flex;flex-direction:column;gap:14px"><span class="mono">Passo a passo</span><ol class="flow">${C.crm.fluxo.map(([t,b])=>`<li><span style="min-width:0"><b>${esc(t)}</b><br><span style="color:var(--muted);font-size:14px">${esc(b)}</span></span></li>`).join('')}</ol></div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="panel" style="display:flex;flex-direction:column;gap:10px"><span class="mono">Etapas da pipeline</span><div class="pipe">${C.crm.etapas.map(e=>`<span>${esc(e)}</span>`).join('')}</div><p style="color:var(--muted);font-size:13px">Arraste o card ou use o botão Mover conforme o lead avança.</p></div>
      <div class="panel" style="display:flex;flex-direction:column;gap:10px"><span class="mono">Ao agendar: contexto do pré-vendas</span><div class="checks">${C.crm.contexto.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><p style="color:var(--muted);font-size:13px">O Closer recebe a conversa sem começar do zero.</p></div>
      <div class="panel" style="display:flex;flex-direction:column;gap:10px"><span class="mono">Depois da ligação · até 5 minutos</span><div class="checks">${C.crm.posLigacao.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>
      <div class="panel" style="display:flex;flex-direction:column;gap:10px"><span class="mono">Todos os dias</span><p>Veja na agenda quais reuniões você tem e ative cada cliente no grupo para que ele esteja presente na ligação.</p><a class="btn sm" href="#origem-fexo-consultoria" style="align-self:flex-start">Ver mensagens de comparecimento</a></div>
    </div>
  </section>`;

/* ----------------------------------------------------------------- router */
function render(){
  COPY = [];
  const h = (location.hash || '#inicio').slice(1);
  const a = C.aulas.find(x=>x.slug===h); const o = origin(h);
  let active = h, out;
  if(a){ out = aulaView(a); active = 'trilha'; }
  else if(o){ out = origemView(o); active = 'arsenal'; }
  else if(V[h]){ out = V[h](); }
  else { out = V.inicio(); active = 'inicio'; }
  nav(active); railProg();
  $('#view').innerHTML = out;
  if(a) aulaMount(a); if(o) origemMount(o);
  if(h==='spin') spinMount(); if(h==='rotina') rotinaMount();
}
let lastHash = null;
window.addEventListener('hashchange', () => { render(); if(location.hash !== lastHash) window.scrollTo(0,0); lastHash = location.hash; });
render();
setInterval(() => { const h = (location.hash||'#inicio').slice(1); if(h==='inicio' || h==='rotina'){ const y = scrollY; const f = document.activeElement && document.activeElement.id; render(); scrollTo(0,y); if(f && document.getElementById(f)) document.getElementById(f).focus(); } }, 60000);
})();
</script>
</body>
