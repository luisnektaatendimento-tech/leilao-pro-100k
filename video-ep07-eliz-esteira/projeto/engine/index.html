<script>
const D=window.DATA, A='../assets/';
const COL={icp:'#B9B6C3',low:'#A98BF0',int:'#8155D9',prog:'#C9B2FF',scp:'#FFFFFF',pend:'#E8B45A'};
const NAMED={violet:'#A98BF0',white:'#FFFFFF',amber:'#E8B45A'};
const $=s=>document.querySelector(s), world=$('#world'), svg=$('#edges');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eo=x=>1-Math.pow(1-x,3), lerp=(a,b,p)=>a+(b-a)*p;
function win(t,t0,t1,i=.35,o=.45){return Math.min(ease(cl((t-t0)/i)),ease(cl((t1-t)/o)))}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function mk(html,cls='ov',parent){const d=document.createElement('div');d.className=cls;d.innerHTML=html;(parent||$('#ovl')).appendChild(d);return d}

// ---------- colunas
const C=D.cols, COLS=[[C.XI,'PERFIL','Quem entra',['icp']],[C.XL,'ENTRADA','Low ticket',['low']],[C.XN,'INTENSIVO','R$ 997',['int']],[C.XP,'PROGRAMA','R$ 2.997',['prog']],[C.XS,'DESTINO','Objetivo final',['scp']]];
const HDR=COLS.map(([x,a,b,k])=>{const el=mk(`<b>${a}</b><span>${b}</span>`,'hdr',world);el.style.left=x+'px';el.style.top='180px';
  const r=Math.min(...D.nodes.filter(n=>n.x===x&&k.includes(n.kind)).map(n=>n.reveal));return {el,r}});
// ---------- nós
const NM={};
for(const n of D.nodes){
  const h={icp:108,prog:130,scp:190}[n.kind]||118; n.h=h;
  const el=mk((n.tag?`<div class="tag"><i style="background:${COL[n.kind]}"></i>${n.tag}</div>`:'')+`<div class="tt">${n.title}</div>`+(n.sub?`<div class="sb">${n.sub}</div>`:'')+(n.price?`<div class="pr">${n.price}</div>`:''),'node '+n.kind,world);
  el.style.width=n.w+'px'; el.style.left=(n.x-n.w/2)+'px'; el.style.top=(n.y-h/2)+'px';
  if(n.kind==='pend') el.style.borderColor='rgba(232,180,90,.45)';
  n.el=el; NM[n.id]=n;
}
const scpRing=mk('','',world); Object.assign(scpRing.style,{position:'absolute',width:'420px',height:'420px',borderRadius:'50%',left:(NM.scp.x-210)+'px',top:(NM.scp.y-210)+'px',border:'1px solid rgba(169,139,240,.35)',background:'radial-gradient(circle,rgba(129,85,217,.20),transparent 65%)'});
world.insertBefore(scpRing,world.firstChild.nextSibling);
// ---------- arestas
function anchor(n,s){const hw=n.w/2,hh=n.h/2;return s==='b'?[n.x,n.y+hh]:s==='t'?[n.x,n.y-hh]:s==='l'?[n.x-hw,n.y]:[n.x+hw,n.y]}
const NS='http://www.w3.org/2000/svg', EM={};
for(const e of D.edges){
  const a=NM[e.a],b=NM[e.b],dx=b.x-a.x,dy=b.y-a.y; let p0,p1,c0,c1;
  if(Math.abs(dy)>Math.abs(dx)*0.7){const dn=dy>0;p0=anchor(a,dn?'b':'t');p1=anchor(b,dn?'t':'b');const m=(p1[1]-p0[1])*.5;c0=[p0[0],p0[1]+m];c1=[p1[0],p1[1]-m]}
  else{const r=dx>0;p0=anchor(a,r?'r':'l');p1=anchor(b,r?'l':'r');const m=(p1[0]-p0[0])*.5;c0=[p0[0]+m,p0[1]+e.bend];c1=[p1[0]-m,p1[1]+e.bend]}
  const d=`M${p0} C${c0} ${c1} ${p1}`, g=document.createElementNS(NS,'g');
  const mkp=(w)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');return p};
  const base=mkp('2.2'),glow=mkp('3.2'),arr=document.createElementNS(NS,'path');
  arr.setAttribute('d','M-11,-6 L0,0 L-11,6');arr.setAttribute('fill','none');arr.setAttribute('stroke-width','2.4');arr.setAttribute('stroke-linecap','round');arr.setAttribute('stroke-linejoin','round');
  g.append(base,glow,arr); const dots=[];for(let k=0;k<3;k++){const c=document.createElementNS(NS,'circle');c.setAttribute('r','4.5');g.appendChild(c);dots.push(c)}
  let lab=null;if(e.label){lab=document.createElementNS(NS,'text');lab.setAttribute('class','elab');lab.setAttribute('text-anchor','middle');lab.textContent=e.label.toUpperCase();g.appendChild(lab)}
  svg.appendChild(g); const L=base.getTotalLength(), end=base.getPointAtLength(L), pre=base.getPointAtLength(L-6);
  arr.setAttribute('transform',`translate(${end.x},${end.y}) rotate(${Math.atan2(end.y-pre.y,end.x-pre.x)*180/Math.PI})`);
  if(lab){const m=base.getPointAtLength(L/2);lab.setAttribute('x',m.x);lab.setAttribute('y',m.y-14)}
  if(e.style==='dash')base.setAttribute('stroke-dasharray','9 9');
  Object.assign(e,{base,glow,arr,dots,lab,L}); EM[e.id]=e;
}
// ---------- câmera
const CM=D.cam, from=[];
function camEval(i,t){const k=CM[i],f=from[i],p=ease(cl((t-k.t)/k.d));return {x:lerp(f.x,k.x,p),y:lerp(f.y,k.y,p),z:Math.exp(lerp(Math.log(f.z),Math.log(k.z),p))}}
for(let i=0;i<CM.length;i++)from.push(i===0?{x:CM[0].x,y:CM[0].y,z:CM[0].z}:camEval(i-1,CM[i].t));
function camAt(t){let i=0;for(let j=0;j<CM.length;j++)if(CM[j].t<=t)i=j;return camEval(i,t)}
function actOf(id,t){let best=0,col=null;for(const w of D.active){if(t<w.t0-0.4||t>w.t1+0.6||!w.ids.includes(id))continue;const v=win(t,w.t0,w.t1,.4,.6);if(v>best){best=v;col=w.color}}return [best,col]}

// ---------- overlays
for(const o of D.ovl){
  if(o.kind==='title'){o.el=mk(`<div style="position:absolute;left:0;right:0;top:330px;text-align:center"><div class="mono">● Processo de ascensão comercial</div><div class="big" style="margin-top:30px">Esteira de Ascensão</div><div style="font:400 30px Inter;color:#B9B6C3;margin-top:32px">Mentoria Investidor Imobiliário · Eliz Sampaio</div></div>`);o.el.style.inset='0';o.el.style.background='#08080B'}
  if(o.kind==='cards'){o.el=mk(`<div class="mono" style="position:absolute;left:0;right:0;top:220px;text-align:center">Os produtos de entrada</div>`+o.c.map((c,i)=>`<div class="pcard${c[0]?'':' ghost'}" style="left:${120+i*430}px;top:300px">${c[0]?`<div class="shot"><img src="${A}${c[0]}.png"><span class="u">${c[1]}</span></div>`:`<div class="shot" style="display:grid;place-items:center;background:transparent"><span style="font:500 14px Mono;letter-spacing:.16em;color:#8f8a9c">SEM TELA NA GRAVAÇÃO</span></div>`}<div class="meta"><b>${c[2]}</b><span>${c[3]}</span></div></div>`).join('')+`<div class="out" style="position:absolute;left:${120+3*430}px;top:300px;width:400px;height:390px;border-radius:18px;display:grid;place-items:center;background:rgba(8,8,11,.6)"><span style="font:500 15px Mono;letter-spacing:.18em;color:#E8B45A;border:1px solid rgba(232,180,90,.5);padding:9px 16px;border-radius:999px">FORA DESTA ETAPA</span></div>`);o.el.style.inset='0'}
  if(o.kind==='badge'){const n=NM[o.at];o.el=mk('◉ '+o.text,'wtag',world);o.el.style.left=n.x+'px';o.el.style.top=(n.y-n.h/2-34)+'px';o.el.style.borderColor='#A98BF0';o.el.style.color='#D9CCFF'}
  if(o.kind==='tag'){const n=NM[o.at];o.el=mk(o.text,'wtag',world);o.el.style.left=n.x+'px';o.el.style.top=(n.y+(o.dy||-110))+'px';if(n.kind==='pend'){o.el.style.borderColor='rgba(232,180,90,.6)';o.el.style.color='#F0C77A'}}
  if(o.kind==='chips'){const n=NM[o.anchor];const ay=n.y+(o.dy!=null?o.dy:n.h/2+42);o.els=o.items.map(it=>mk(it[0],'wchip',world));
    const ws=o.els.map(e=>e.getBoundingClientRect().width/1),tot=ws.reduce((a,b)=>a+b,0)+(ws.length-1)*12;let x=n.x-tot/2;o.els.forEach((e,i)=>{e.style.left=x+'px';e.style.top=(ay-22)+'px';x+=ws[i]+12})}
  if(o.kind==='vs'){const n=NM[o.at];o.el=mk(`<div style="display:flex;align-items:center;gap:18px;white-space:nowrap"><span class="va" style="font:600 22px Inter;color:#8f8a9c;position:relative">${o.a}<i style="position:absolute;left:-4px;right:-4px;top:52%;height:2px;background:#E8B45A;transform-origin:0 50%"></i></span><span style="font:400 26px Inter;color:#A98BF0">→</span><span class="vb" style="font:700 24px Manrope;color:#fff">${o.b}</span></div>`,'ov',world);o.el.style.left=(n.x-n.w/2)+'px';o.el.style.top=(n.y-n.h/2-80)+'px'}
  if(o.kind==='colhl'){o.el=mk('','colband',world);o.el.style.left=(o.col-250)+'px';o.el.style.width='500px';world.insertBefore(o.el,svg)}
  if(o.kind==='grade'){o.el=mk(`
    <div style="position:absolute;left:0;right:0;top:120px;text-align:center"><div class="mono">Mentoria Investidor Imobiliário</div><div style="font:800 64px Manrope;letter-spacing:-.02em;margin-top:18px">Do conceito ao cálculo</div></div>
    <svg style="position:absolute;left:0;top:0" width="1920" height="1080"><line x1="700" y1="520" x2="1220" y2="520" stroke="#3a3150" stroke-width="2.5" stroke-dasharray="10 10"/><line class="gl" x1="700" y1="520" x2="1220" y2="520" stroke="#A98BF0" stroke-width="3"/>
      <circle class="s0" cx="830" cy="520" r="9" fill="#08080B" stroke="#E8B45A" stroke-width="2.5"/><circle class="s1" cx="960" cy="520" r="9" fill="#08080B" stroke="#E8B45A" stroke-width="2.5"/><circle class="s2" cx="1090" cy="520" r="9" fill="#08080B" stroke="#E8B45A" stroke-width="2.5"/></svg>
    <div class="gnode ga" style="left:170px;top:400px"><small>PONTO DE PARTIDA</small><b>O que é: conceito do mercado imobiliário</b><span class="gchip ge">o que é cada etapa</span></div>
    <div class="gnode gb" style="left:1230px;top:400px"><small>PONTO DE CHEGADA</small><b>Cálculo de investimento e retorno</b><span class="gchip gv">viabilidade da operação</span></div>
    <div class="gt" style="position:absolute;left:0;right:0;top:560px;text-align:center"><span style="font:500 15px Mono;letter-spacing:.18em;color:#E8B45A;border:1px solid rgba(232,180,90,.55);background:rgba(20,15,6,.8);padding:10px 18px;border-radius:999px">A GRADE ENTRE OS DOIS · TAREFA DA ELIZ</span></div>
    <div class="gs" style="position:absolute;left:0;right:0;top:760px;text-align:center;font:600 28px Inter;color:#fff">Objetivo: <span style="color:#C9B2FF">uma entrega escalável</span>, sem a Eliz presa a cada cliente</div>`);o.el.style.inset='0'}
  if(o.kind==='end'){o.el=mk(`<div style="position:absolute;left:0;right:0;top:250px;text-align:center"><div class="mono">Mentoria Investidor Imobiliário</div>
    <div style="font:800 76px Manrope;letter-spacing:-.02em;margin-top:28px;line-height:1.1">Uma esteira. Três trilhas.<br>Um destino.</div>
    <div style="display:flex;justify-content:center;gap:16px;margin-top:54px;font:600 24px Inter">${['Entrada','Intensivo','Programa','SCP'].map((s,i)=>`<span class="st" style="padding:12px 26px;border-radius:999px;border:1px solid rgba(169,139,240,.5);background:rgba(33,21,54,.85)">${s}</span>${i<3?'<span class="sa" style="color:#A98BF0;align-self:center">→</span>':''}`).join('')}</div>
    <div class="nx" style="margin-top:70px;font:500 16px Mono;letter-spacing:.22em;color:#B9B6C3">A SEGUIR · O SISTEMA OPERACIONAL COMERCIAL DA ELIZ</div></div>`);o.el.style.inset='0';o.el.style.background='rgba(8,8,11,.92)'}

// ---------- capítulos
const chlab=$('#chlab'),chbar=$('#chbar');D.chapters.slice(1).forEach(()=>{const i=document.createElement('i');i.innerHTML='<u></u>';chbar.appendChild(i)});
const gapCards=D.gaps.map(g=>{const c=D.chapters.find(c=>c.n===g.chapter);const el=mk(`<div style="position:absolute;left:0;right:0;top:390px;text-align:center"><div class="mono">Capítulo 0${c.n}</div><div style="width:60px;height:2px;background:#8155D9;margin:26px auto"></div><div class="ct" style="font:800 74px Manrope;letter-spacing:-.02em">${c.title}</div></div>`);el.style.inset='0';return {g,el}});
