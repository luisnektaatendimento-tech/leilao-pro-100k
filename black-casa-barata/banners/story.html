<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Archivo";src:url(../assets/fonts/archivo.woff2) format("woff2");font-weight:400 900;font-stretch:100% 125%}
@font-face{font-family:"DM Sans";src:url(../assets/fonts/dmsans.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:"Manrope";src:url(../assets/fonts/manrope.woff2) format("woff2");font-weight:600 800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:360px;height:640px;background:#000;overflow:hidden}
.s{position:relative;width:360px;height:640px;overflow:hidden;font-family:"DM Sans",sans-serif;color:#fff;
 background:radial-gradient(140px 140px at 180px 330px,rgba(255,190,0,.5),transparent 70%),radial-gradient(90% 40% at 50% 0%,rgba(255,170,0,.22),transparent 70%),linear-gradient(180deg,#120d05,#050505 45%,#000)}
.raios{position:absolute;left:180px;top:330px;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,rgba(255,210,90,.10) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 8%,transparent 66%);mask:radial-gradient(closest-side,#000 8%,transparent 66%)}
.grade{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse 80% 40% at 50% 20%,#000,transparent 75%);mask-image:radial-gradient(ellipse 80% 40% at 50% 20%,#000,transparent 75%)}
.estrela{position:absolute;width:18px;height:18px;background:radial-gradient(circle,#fff 0 12%,rgba(255,240,170,.9) 20%,transparent 46%),linear-gradient(90deg,transparent 46%,#fff 50%,transparent 54%),linear-gradient(0deg,transparent 46%,#fff 50%,transparent 54%);z-index:8}
.topo{position:absolute;left:0;right:0;top:66px;text-align:center;z-index:5}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#e11d2a;font:800 10px/1 Archivo;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 3px 14px rgba(225,29,42,.55)}
.tag i{width:6px;height:6px;border-radius:50%;background:#fff}
.black{margin-top:12px;font:800 13px/1 Archivo;font-stretch:125%;letter-spacing:.55em;margin-right:-.55em;color:#ffd95a;text-shadow:0 0 14px rgba(255,190,0,.5)}
.logo{margin-top:6px;font:900 34px/1 Archivo;white-space:nowrap;font-stretch:125%;letter-spacing:-.035em;text-transform:uppercase;
 background:linear-gradient(180deg,#fffbe0 0%,#fff1a6 14%,#ffd93b 32%,#ffb800 47%,#c97a00 53%,#ffbf1f 63%,#ffe680 82%,#fff6c4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:.5px #7a3d00;filter:drop-shadow(0 1px 0 #c46d00) drop-shadow(0 3px 0 #8a4200) drop-shadow(0 5px 0 #5a2a00) drop-shadow(0 14px 16px rgba(0,0,0,.85))}
.logo span{display:block;padding-top:.08em;line-height:.92}.logo span+span{font-size:.84em}
.sub{margin:10px auto 0;max-width:290px;font:600 13.5px/1.3 "DM Sans";color:#f0f0f0}
.sub b{color:#ffd95a}
.fone{position:absolute;left:124px;top:236px;width:112px;height:210px;transform:rotate(-6deg);z-index:4;border-radius:22px;padding:5px;background:#050505;
 box-shadow:0 0 0 1.5px #c9c9ce,0 0 0 3px #3a3a3e,0 24px 40px rgba(0,0,0,.85),0 0 60px rgba(255,180,0,.45)}
.fone .tela{position:relative;width:100%;height:100%;border-radius:17px;overflow:hidden;background:#fff}
.fone img{width:100%;display:block;margin-top:11px}
.fone .ilha{position:absolute;left:50%;top:6px;width:38px;height:9px;margin-left:-19px;border-radius:9px;background:#000;z-index:2}
.fone .ref{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 30%,transparent 70%,rgba(255,255,255,.08));z-index:2}
.masc{position:absolute;left:240px;top:300px;width:70px;z-index:7;filter:drop-shadow(0 8px 14px rgba(124,58,237,.75))}
.chip{position:absolute;z-index:7;white-space:nowrap;display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:11px;font:800 11px/1 Manrope;box-shadow:0 8px 18px rgba(0,0,0,.65)}
.c-fx{left:34px;top:276px;background:#17181d;box-shadow:inset 0 0 0 1.5px rgba(191,242,58,.65),0 8px 18px rgba(0,0,0,.65)}
.c-fx img{height:14px}
.c-cw{left:24px;top:380px;background:#0b0b0b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 8px 18px rgba(0,0,0,.65);font:600 10px/1 "DM Sans";letter-spacing:.1em}
.c-cw i{width:7px;height:7px;border-radius:50%;background:#ff453a}
.c-ap{left:214px;top:392px;background:#2563eb;color:#fff;font:700 10.5px/1 Manrope}
.burst{position:absolute;left:266px;top:250px;width:76px;height:76px;transform:rotate(12deg);z-index:8;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.burst::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 38% 30%,#ff7a5c,#f2231b 48%,#a80d0d);clip-path:polygon(50% 0,59% 12%,73% 5%,76% 20%,91% 18%,86% 33%,100% 40%,89% 51%,99% 64%,84% 69%,86% 84%,71% 82%,64% 96%,52% 87%,40% 98%,33% 84%,18% 88%,18% 72%,3% 66%,13% 54%,0 42%,14% 35%,9% 20%,24% 20%,26% 5%,40% 12%)}
.burst span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);text-shadow:0 2px 0 rgba(90,0,0,.5)}
.burst b{font:900 22px/1 Archivo;font-stretch:118%;letter-spacing:-.03em}.burst i{font:900 9px/1 Archivo;font-style:normal;letter-spacing:.2em;margin-top:1px}
.preco{position:absolute;left:0;right:0;top:456px;z-index:6;display:flex;align-items:flex-end;justify-content:center;gap:10px}
.preco s{font:600 13px/1 "DM Sans";color:#ff8a73;padding-bottom:7px}
.preco b{white-space:nowrap;font:900 48px/.9 Archivo;font-stretch:112%;letter-spacing:-.04em;background:linear-gradient(180deg,#fffbe0,#ffd93b 40%,#ffb800 62%,#ffe680);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #8a4200) drop-shadow(0 10px 16px rgba(255,170,0,.3))}
.preco b small{font-size:.4em;vertical-align:1.1em;margin-right:3px}
.preco em{font-style:normal;padding:5px 8px;border-radius:7px;background:#7ee2a8;color:#062b16;font:800 9.5px/1.1 Archivo;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.seg{position:absolute;left:0;right:0;top:590px;display:flex;justify-content:center;gap:12px;list-style:none;font:600 9.5px/1 "DM Sans";color:#9ff0c2;z-index:6}
/* área do link */
.link{position:absolute;left:0;right:0;top:508px;z-index:6;text-align:center}
.link p{display:inline-flex;align-items:center;gap:6px;font:800 11px/1 Archivo;letter-spacing:.16em;text-transform:uppercase;color:#ffd95a}
.link p i{display:inline-block;font-style:normal;animation:none;font-size:14px}
.vaga{width:240px;height:42px;margin:8px auto 0;border-radius:12px;border:2px dashed rgba(255,217,90,.8);background:rgba(255,217,90,.06);display:flex;align-items:center;justify-content:center;font:700 10px/1 "DM Sans";letter-spacing:.08em;text-transform:uppercase;color:rgba(255,217,90,.85)}
.limpo .vaga{border-color:transparent;background:transparent;color:transparent}
</style></head><body>
<div class="s" id="s">
  <div class="raios"></div><div class="grade"></div>
  <i class="estrela" style="left:46px;top:222px"></i><i class="estrela" style="left:318px;top:420px;transform:scale(.7)"></i><i class="estrela" style="left:70px;top:446px;transform:scale(.6)"></i>
  <div class="topo">
    <span class="tag"><i></i>Black Friday · só hoje</span>
    <p class="black">BLACK</p>
    <h1 class="logo"><span>Casa Barata</span><span>de Leilão</span></h1>
    <p class="sub"><b>4 apps</b> para arrematar imóvel de leilão com <b>5% de entrada</b></p>
  </div>
  <div class="fone"><div class="tela"><i class="ilha"></i><img src="../assets/video/fexo.webp" alt=""><i class="ref"></i></div></div>
  <img class="masc" src="../assets/multy.webp" alt="">
  <span class="chip c-fx"><img src="../assets/fexo-logo.webp" alt="Fexô"></span>
  <span class="chip c-cw"><i></i>CANAW AO VIVO</span>
  <span class="chip c-ap">Aceita financiamento</span>
  <div class="burst"><span><b>-96%</b><i>OFF</i></span></div>
  <div class="preco"><s>de R$925</s><b><small>R$</small>37</b><em>+ aula<br>bônus</em></div>
  <ul class="seg"><li>✓ Compra segura</li><li>✓ Acesso imediato</li><li>✓ 7 dias de garantia</li></ul>
  <div class="link"><p><i>👇</i>Toque no link<i>👇</i></p><div class="vaga">cole o link aqui</div></div>
</div>
</body></html>
