<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Archivo";src:url(../assets/fonts/archivo.woff2) format("woff2");font-weight:400 900;font-stretch:100% 125%}
@font-face{font-family:"DM Sans";src:url(../assets/fonts/dmsans.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:"Manrope";src:url(../assets/fonts/manrope.woff2) format("woff2");font-weight:600 800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:300px;height:250px;background:#000;overflow:hidden}
.b{position:relative;width:300px;height:250px;overflow:hidden;font-family:"DM Sans",sans-serif;color:#fff;
 background:radial-gradient(70% 60% at 50% 0%,rgba(255,190,0,.28),transparent 70%),radial-gradient(60% 50% at 100% 100%,rgba(124,58,237,.22),transparent 70%),radial-gradient(60% 50% at 0% 100%,rgba(191,242,58,.14),transparent 70%),#050505}
.b::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 0%,#000,transparent 75%)}
.b::after{content:"";position:absolute;inset:0;border-radius:0;box-shadow:inset 0 0 0 2px rgba(255,200,40,.55)}
.burst{position:absolute;right:-6px;top:-8px;width:74px;height:74px;transform:rotate(12deg)}
.burst::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 38% 30%,#ff7a5c,#f2231b 48%,#a80d0d);clip-path:polygon(50% 0,59% 12%,73% 5%,76% 20%,91% 18%,86% 33%,100% 40%,89% 51%,99% 64%,84% 69%,86% 84%,71% 82%,64% 96%,52% 87%,40% 98%,33% 84%,18% 88%,18% 72%,3% 66%,13% 54%,0 42%,14% 35%,9% 20%,24% 20%,26% 5%,40% 12%)}
.burst span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);text-shadow:0 2px 0 rgba(90,0,0,.5)}
.burst b{font:900 19px/1 Archivo;font-stretch:118%;letter-spacing:-.03em}
.burst i{font:900 9px/1 Archivo;font-style:normal;letter-spacing:.2em;margin-top:1px}
.top{position:relative;padding:14px 16px 0}
.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:linear-gradient(180deg,#fff7c2,#ffd23a 40%,#e89a00 75%,#ffcb2e);color:#2a1600;font:800 8.5px/1 Archivo;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 0 1px #9a5a00}
.black{margin-top:10px;font:800 11px/1 Archivo;font-stretch:125%;letter-spacing:.5em;color:#ffd95a}
.logo{margin-top:5px;font:900 27px/.94 Archivo;white-space:nowrap;font-stretch:125%;letter-spacing:-.035em;text-transform:uppercase;
 background:linear-gradient(180deg,#fffbe0 0%,#fff1a6 14%,#ffd93b 30%,#ffb800 46%,#c97a00 52%,#ffbf1f 62%,#ffe680 80%,#fff6c4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:.35px #7a3d00;filter:drop-shadow(0 1px 0 #c46d00) drop-shadow(0 2px 0 #8a4200) drop-shadow(0 3px 0 #5a2a00) drop-shadow(0 6px 10px rgba(0,0,0,.7))}
.logo span{display:block;font-size:.84em}
.sub{margin-top:9px;font:600 11.5px/1.3 "DM Sans";color:#fff}
.sub em{font-style:normal;color:#ffd95a}
.apps{position:absolute;left:16px;bottom:56px;display:flex;gap:5px}
.app{display:flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:7px;font:800 10px/1 Manrope;letter-spacing:-.02em}
.app img{height:12px;width:auto}
.app svg{width:12px;height:12px}
.fx{background:#17181d;box-shadow:inset 0 0 0 1px rgba(191,242,58,.5)}
.my{background:#1a0f33;box-shadow:inset 0 0 0 1px rgba(168,85,247,.55)}
.cw{background:#0b0b0b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);font-weight:600;letter-spacing:.14em;font-size:8.5px}
.ds{background:#0a1730;box-shadow:inset 0 0 0 1px rgba(59,130,246,.55);color:#8db8ff}
.rod{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:8px}
.preco{flex:none;line-height:1}
.preco s{display:block;font:600 9.5px/1 "DM Sans";color:#ff8a73}
.preco b{display:block;margin-top:2px;font:900 22px/1 Archivo;font-stretch:112%;letter-spacing:-.03em;background:linear-gradient(180deg,#fffbe0,#ffd93b 40%,#ffb800 60%,#ffe680);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #8a4200)}
.cta{flex:1;display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 4px 0 12px;border-radius:999px;background:linear-gradient(180deg,#fff7c2 0%,#ffe066 18%,#ffc61a 40%,#e89a00 62%,#ffcb2e 84%,#fff0a0 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 0 1px #9a5a00,0 6px 16px -6px rgba(255,180,0,.8);color:#2a1600;font:800 9.5px/1 Archivo;letter-spacing:.1em;text-transform:uppercase}
.cta i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#140b00;color:#ffd95a;font-style:normal;font-size:13px}
</style></head><body>
<div class="b">
  <div class="burst"><span><b>-96%</b><i>OFF</i></span></div>
  <div class="top">
    <span class="tag">4 apps + aula bônus</span>
    <p class="black">BLACK</p>
    <h1 class="logo">Casa Barata<span>de Leilão</span></h1>
    <p class="sub"><em>4 apps</em> para arrematar imóvel de leilão<br>financiado com <em>5% de entrada</em></p>
  </div>
  <div class="apps">
    <span class="app fx"><img src="../assets/fexo-logo.webp" alt="Fexô"></span>
    <span class="app my"><svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="3" y1="27" x2="29" y2="5" gradientUnits="userSpaceOnUse"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><path d="M5.5 25.5V12.5a5.25 5.25 0 0 1 10.5 0v13M16 12.5a5.25 5.25 0 0 1 10.5 0V17" fill="none" stroke="url(#g)" stroke-width="4.4" stroke-linecap="round"/><circle cx="26.5" cy="25.3" r="2.6" fill="#c084fc"/></svg>multy</span>
    <span class="app cw">CANAW</span>
    <span class="app ds">Dossiê</span>
  </div>
  <div class="rod">
    <div class="preco"><s>de R$925</s><b>R$37</b></div>
    <div class="cta">Acessar agora<i>→</i></div>
  </div>
</div>
</body></html>
