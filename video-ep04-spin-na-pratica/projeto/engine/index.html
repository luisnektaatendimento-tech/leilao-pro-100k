<style>

:root{--lime:#c8f43c;--blue:#4d8dff;--red:#ff3d3d;--amber:#ffb547;--ink:#f4f5f7;--mute:#8b919b;--line:#2a2e35;--bg:#060709}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#bg{position:absolute;inset:-200px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px}

#edges{position:absolute;left:0;top:0;overflow:visible}
.node{position:absolute;height:106px;border-radius:16px;padding:14px 18px 0 18px;background:linear-gradient(180deg,rgba(24,27,32,.92),rgba(14,16,19,.92));border:1.5px solid #2c3139;box-shadow:0 10px 30px rgba(0,0,0,.45)}

.node.chip{height:56px;padding:14px 16px;border-radius:26px;text-align:center}
.node.chip .tt{font:600 20px Inter}
.node.out{height:120px;padding-top:18px}
.node.out .tt{font:700 30px Grotesk;letter-spacing:.01em;text-transform:uppercase}
.prio{position:absolute;right:-14px;top:-16px;font:700 18px Grotesk;padding:5px 11px;border-radius:10px;background:#ffb547;color:#0a0b0d;box-shadow:0 0 18px rgba(255,181,71,.55);display:none}
.hdr{position:absolute;font:700 64px Grotesk;letter-spacing:.32em;transform:translateX(-50%);white-space:nowrap}

/* demo */
.frame{position:absolute;border-radius:14px;overflow:hidden;background:#0d0f12;border:1px solid #2d323a;box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03)}
.frame .bar{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#14171b;border-bottom:1px solid #22262c}

.hl{position:absolute;border-radius:12px;border:2.5px solid var(--lime);box-shadow:0 0 0 4000px rgba(0,0,0,.0),0 0 24px rgba(200,244,60,.55)}

.ov{position:absolute}

#chbar{position:absolute;left:56px;top:76px;display:flex;gap:6px}

.mono{font:500 16px Mono;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
</style></head>
<body><div id="stage">
 <div id="bg"></div><div id="glow1"></div><div id="glow2"></div>
 <div id="world"><svg id="edges" width="3000" height="1800"></svg></div>

</div>
<script src="data.js"></script>
<script>
const D=window.DATA, A='../assets/';
const COL={h1:'#ffd166',h2:'#ff9f43',h3:'#ff5d5d',h4:'#e0245e',q1:'#ffd166',q2:'#ff9f43',q3:'#ff5d5d',q4:'#e0245e',sp1:'#ffd166',sp2:'#ff9f43',sp3:'#ff5d5d',sp4:'#e0245e',yes:'#c8f43c',no:'#ff6b6b',low:'#b79cff',phase:'#ffffff',ghost:'#5b616b',fexo:'#c8f43c',credit:'#4d8dff',edu:'#e9ebee',conv:'#ffffff',out:'#ffffff',canaw:'#ff3d3d',entry:'#ffb547',chip:'#e9ebee'};
const NAMED={lime:'#c8f43c',white:'#ffffff',red:'#ff3d3d'};
const $=s=>document.querySelector(s), world=$('#world'), svg=$('#edges');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eo=x=>1-Math.pow(1-x,3);
const lerp=(a,b,p)=>a+(b-a)*p;
function win(t,t0,t1,i=.35,o=.45){return Math.min(ease(cl((t-t0)/i)),ease(cl((t1-t)/o)))}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}

// ---------- build map
const NM={};
for(const n of D.nodes){
  const el=document.createElement('div'); el.className='node'+((n.kind==='chip'||n.kind.startsWith('sp'))?' chip':'')+(n.kind==='out'?' out':'');
  n.w=Math.round(n.w*1.12); el.style.width=n.w+'px'; const h=(n.kind==='chip'||n.kind.startsWith('sp'))?56:n.kind==='out'?120:106; n.h=h;
  el.style.left=(n.x-n.w/2)+'px'; el.style.top=(n.y-h/2)+'px';
  const c=COL[n.kind];
  el.innerHTML=(n.tag?`<div class="tag"><i style="background:${c}"></i>${n.tag}</div>`:'')+`<div class="tt">${n.title}</div>`+(n.sub&&n.kind!=='chip'&&!n.kind.startsWith('sp')?`<div class="sb">${n.sub}</div>`:'');
  if(n.kind==='out') el.style.textAlign='center', el.querySelector('.tag').style.justifyContent='center';
  if(n.prio){const b=document.createElement('div');b.className='prio';b.textContent=n.prio;el.appendChild(b);n.pb=b}
  world.appendChild(el); n.el=el; NM[n.id]=n;
}
const HDR=D.headers.map(h=>Object.assign({},h,{r:NM[h.rid].reveal}));
document.getElementById('brand').textContent=D.meta.brand;
for(const h of HDR){const el=document.createElement('div');el.className='hdr';el.style.left=h.x+'px';el.style.top=h.y+'px';el.style.color=h.c;
  if(h.small){el.style.font='700 26px Grotesk';el.style.letterSpacing='.3em'}
  el.innerHTML=h.t+(h.small?'':`<small>${h.s}</small>`);world.appendChild(el);h.el=el}
function anchor(n,side){const hw=n.w/2,hh=n.h/2;return side==='b'?[n.x,n.y+hh]:side==='t'?[n.x,n.y-hh]:side==='l'?[n.x-hw,n.y]:[n.x+hw,n.y]}
const NS='http://www.w3.org/2000/svg';
for(const e of D.edges){
  const a=NM[e.a],b=NM[e.b]; const dx=b.x-a.x,dy=b.y-a.y; let p0,p1,c0,c1;
  if(Math.abs(dy)>Math.abs(dx)*0.45){ const dn=dy>0; p0=anchor(a,dn?'b':'t');p1=anchor(b,dn?'t':'b'); const m=(p1[1]-p0[1])*.5;
    c0=[p0[0]+e.bend,p0[1]+m];c1=[p1[0]+e.bend,p1[1]-m]; }
  else { const r=dx>0; p0=anchor(a,r?'r':'l');p1=anchor(b,r?'l':'r'); const m=(p1[0]-p0[0])*.5;
    c0=[p0[0]+m,p0[1]+e.bend];c1=[p1[0]-m,p1[1]+e.bend]; }
  if(e.side){const dr=e.side==='l'?-1:1; p0=anchor(a,e.side); p1=anchor(b,e.side); const off=e.off||150; c0=[p0[0]+dr*off,p0[1]+40]; c1=[p0[0]+dr*off,p1[1]]; }
  else if(e.kind==='bridge'&&e.id!=='e18'){p0=anchor(a,'t');p1=anchor(b,'t');c0=[p0[0],p0[1]+e.bend*1.6];c1=[p1[0],p1[1]+e.bend*1.6]}
  const d=`M${p0} C${c0} ${c1} ${p1}`;
  const g=document.createElementNS(NS,'g');
  const base=document.createElementNS(NS,'path'); base.setAttribute('d',d); base.setAttribute('fill','none'); base.setAttribute('stroke','#3a4049'); base.setAttribute('stroke-width','2.2');
  const glow=document.createElementNS(NS,'path'); glow.setAttribute('d',d); glow.setAttribute('fill','none'); glow.setAttribute('stroke-width','3'); glow.setAttribute('stroke-linecap','round');
  const arr=document.createElementNS(NS,'path'); arr.setAttribute('d','M-11,-6 L0,0 L-11,6'); arr.setAttribute('fill','none'); arr.setAttribute('stroke-width','2.4'); arr.setAttribute('stroke-linecap','round'); arr.setAttribute('stroke-linejoin','round');
  g.append(base,glow,arr); const dots=[];for(let k=0;k<3;k++){const c=document.createElementNS(NS,'circle');c.setAttribute('r','4.5');g.appendChild(c);dots.push(c)}
  let lab=null; if(e.label){lab=document.createElementNS(NS,'text');lab.setAttribute('class','elab');lab.setAttribute('text-anchor','middle');lab.textContent=e.label.toUpperCase();g.appendChild(lab)}
  svg.appendChild(g); const L=base.getTotalLength();
  const end=base.getPointAtLength(L), pre=base.getPointAtLength(L-6); arr.setAttribute('transform',`translate(${end.x},${end.y}) rotate(${Math.atan2(end.y-pre.y,end.x-pre.x)*180/Math.PI})`);
  if(lab){const m=base.getPointAtLength(L/2);lab.setAttribute('x',m.x);lab.setAttribute('y',m.y-12)}
  Object.assign(e,{base,glow,arr,dots,lab,L,mid:base.getPointAtLength(L/2)});
  if(e.style==='dash'){base.setAttribute('stroke-dasharray','9 9')}
}
const EM={};for(const e of D.edges)EM[e.id]=e;

// ---------- camera
const C=D.cam; const from=[];
for(let i=0;i<C.length;i++){ if(i===0){from.push({x:C[0].x,y:C[0].y,z:C[0].z});continue}
  from.push(camEval(i-1,C[i].t)); }
function camEval(i,t){const k=C[i],f=from[i],p=ease(cl((t-k.t)/k.d));return {x:lerp(f.x,k.x,p),y:lerp(f.y,k.y,p),z:Math.exp(lerp(Math.log(f.z),Math.log(k.z),p))}}
function camAt(t){let i=0;for(let j=0;j<C.length;j++)if(C[j].t<=t)i=j;return camEval(i,t)}

// ---------- activity
function actOf(id,t){let best=0,col=null;for(const w of D.active){if(t<w.t0-0.4||t>w.t1+0.6)continue;if(!w.ids.includes(id))continue;const v=win(t,w.t0,w.t1,.4,.6);if(v>best){best=v;col=w.color}}return [best,col]}

// ---------- overlays (static DOM, toggled)
const ovl=$('#ovl');
function mk(html,cls='ov',parent=ovl){const d=document.createElement('div');d.className=cls;d.innerHTML=html;parent.appendChild(d);return d}
for(const o of D.ovl){
  if(o.kind==='title'){o.el=mk(`<div style="position:absolute;left:0;right:0;top:330px;text-align:center"><div class="mono" style="color:#ff3d3d">● ${D.meta.ep}</div><div class="big" style="margin-top:26px">${D.meta.title}</div><div style="font:400 30px Inter;color:#aab0b9;margin-top:30px">${D.meta.sub}</div></div>`);o.el.style.inset='0';o.el.style.background='#050607'}
  if(o.kind==='lower'){o.el=mk(`<div style="display:flex;align-items:center;gap:18px"><div style="width:4px;height:64px;background:#ff3d3d;border-radius:2px"></div><div><div style="font:700 34px Grotesk">${o.name}</div><div class="mono" style="font-size:14px;margin-top:6px">${o.role}</div></div></div>`);o.el.style.left='96px';o.el.style.top='820px'}
  if(o.kind==='duo'){o.el=mk(`<div style="position:absolute;left:0;right:0;top:250px;display:flex;justify-content:center;gap:90px">
     <div class="dc" style="width:520px;height:330px;border:1px solid #2d323a;border-radius:22px;background:linear-gradient(180deg,#14171b,#0c0e11);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px"><img src="${A}logo_fexo_dark.png" style="height:72px"><div class="mono" style="font-size:14px">imóveis de oportunidade · crédito</div></div>
     <div class="dc" style="width:520px;height:330px;border:1px solid #2d323a;border-radius:22px;background:linear-gradient(180deg,#14171b,#0c0e11);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px"><img src="${A}logo_canaw.png" style="height:150px"><div class="mono" style="font-size:14px">a TV dos especialistas</div></div></div>
     <div style="position:absolute;left:0;right:0;top:640px;display:flex;justify-content:center;gap:26px;font:700 30px Grotesk;letter-spacing:.12em">
     <span class="s1" style="padding:14px 30px;border:1px solid #c8f43c;border-radius:999px;color:#c8f43c">SERVIÇO</span><span class="s2" style="padding:14px 30px;border:1px solid #fff;border-radius:999px">MENTORIA</span></div>
     <div class="s3 mono" style="position:absolute;left:0;right:0;top:740px;text-align:center;font-size:17px">dos especialistas do mercado imobiliário</div>`);o.el.style.inset='0'}
  if(o.kind==='sketch'){o.el=mk(`<div class="frame" style="left:260px;top:120px;width:1400px;height:700px"><div class="bar"><i></i><i></i><i></i><span class="url">excalidraw.com · rascunho original</span></div><div class="vp" style="height:660px"><img src="${A}sketch.png" style="width:1400px;filter:grayscale(1) contrast(1.05) brightness(.92)"></div></div><div class="mono" style="position:absolute;left:260px;top:840px">O rascunho da aula  →  agora, em um único mapa</div>`);o.el.style.inset='0'}
  if(o.kind==='pillars'){o.el=mk(`<div style="position:absolute;left:0;right:0;top:118px;display:flex;justify-content:center;gap:22px">${o.items.map((it,i)=>`<span class="p${i}" style="font:700 30px Grotesk;letter-spacing:.06em;padding:12px 28px;border-radius:999px;border:1px solid #ff3d3d;background:rgba(20,6,6,.85)">${it[0]}</span>`).join('')}</div>`);o.el.style.inset='0'}
  if(o.kind==='end'){o.el=mk(D.meta.endHTML);o.el.style.inset='0';o.el.style.background='rgba(5,6,7,.9)'}
  if(o.kind==='tag'){o.el=mk(o.text,'wtag',world);o.el.style.left=o.x+'px';o.el.style.top=o.y+'px'}
  if(o.kind==='badge'){const n=NM[o.at];o.el=mk('◉ '+o.text.toUpperCase(),'wtag',world);o.el.style.left=n.x+'px';o.el.style.top=(n.y-80)+'px';o.el.style.borderColor='#ff3d3d';o.el.style.color='#ff6b6b'}
  if(o.kind==='chips'){let ax,ay; if(o.anchor==='b1mid'){ax=EM.b1.mid.x;ay=EM.b1.mid.y-60}else{const n=NM[o.anchor];ax=n.x;ay=n.y+(o.dy||0)-(o.dy?0:92)}
     o.els=o.items.map((it,i)=>{const c=mk(it[0],'wchip',world);return c}); const ws=o.els.map(e=>e.getBoundingClientRect().width); const tot=ws.reduce((a,b)=>a+b,0)+(ws.length-1)*12; let x=ax-tot/2;
     o.els.forEach((e,i)=>{e.style.left=x+'px';e.style.top=(ay-22)+'px';x+=ws[i]+12})}
  if(o.kind==='crowd'){let h='';const rnd=k=>{const x=Math.sin(k*127.1+311.7)*43758.5453;return x-Math.floor(x)};o.dots=[];
     for(let k=0;k<220;k++){const x=300+rnd(k)*1320,y=250+rnd(k+999)*470;const sel=o.sel.find(z=>z[0]===k);h+=`<i class="cd" style="position:absolute;left:${x}px;top:${y}px;width:12px;height:12px;border-radius:50%;background:#6c727c"></i>`;o.dots.push({k,sel,x,y})}
     o.el=mk(`<div class="mono" style="position:absolute;left:0;right:0;top:150px;text-align:center;font-size:17px">${o.head}</div>${h}<div class="cap" style="position:absolute;left:0;right:0;top:770px;text-align:center;font:700 40px Grotesk">${o.cap}</div>`);o.el.style.inset='0';
     o.ds=[...o.el.querySelectorAll('.cd')]}
  if(o.kind==='channels'){const card=(cls,ic,t,s)=>`<div class="${cls}" style="width:520px;height:330px;border-radius:24px;border:1.5px solid #2d323a;background:linear-gradient(180deg,#15181c,#0c0e11);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">${ic}<div style="font:700 44px Grotesk">${t}</div><div class="mono" style="font-size:15px">${s}</div></div>`;
     const wa=`<svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#25d366" stroke-width="1.6"><path d="M20 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.2A8.5 8.5 0 1 1 20 11.5z"/></svg>`;
     const ph=`<svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#c8f43c" stroke-width="1.6"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>`;
